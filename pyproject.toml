[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "relationship-knowledge-base"
version = "0.1.0"
description = "Local-first relationship psychology knowledge base and hybrid RAG index"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Relationship Knowledge Base contributors" }]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
documents = ["pypdf>=5.0", "python-docx>=1.1"]
dev = ["pytest>=8.0"]
all = [
  "sentence-transformers>=3.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pytest>=8.0",
]

[project.scripts]
relationship-kb = "relationship_kb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relationship_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

